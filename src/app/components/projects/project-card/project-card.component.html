<article
  class="card-root flex flex-col justify-between p-5 w-full h-full min-h-80 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-300 cursor-pointer group"
  (click)="onClick()"
>
  <div class="flex flex-col gap-3 min-h-0">
    <div
      class="relative w-full h-36 rounded-md overflow-hidden bg-black/40 border border-white/10"
    >
      @if (!imageLoaded()) {
        <div class="absolute inset-0 animate-pulse bg-white/10"></div>
      }
      <img
        [src]="project()?.images?.[0] || 'assets/images/projects/default.webp'"
        [alt]="project()?.nome"
        loading="lazy"
        class="w-full h-full object-cover transition-all duration-300 group-hover:scale-105"
        [class.opacity-0]="!imageLoaded()"
        (load)="onImageLoad()"
        (error)="onImageError($event)"
      />
    </div>

    @if (variant()?.problem) {
      <p
        class="m-0 text-[10px] font-mono uppercase tracking-wider leading-relaxed min-h-[1rem]"
        style="color: var(--accent)"
      >
        {{ variant()!.problem }}
      </p>
    }

    <h4
      class="card-title m-0 font-medium text-white leading-snug transition-colors"
    >
      {{ project()?.nome }}
    </h4>

    <p class="m-0 text-sm text-white/50 leading-relaxed line-clamp-2">
      {{ cardDesc() }}
    </p>
  </div>

  <div class="flex flex-wrap gap-1.5 pt-3">
    @for (tag of sortedCardTags(); track tag.label) {
      @if (isTagHighlighted(tag)) {
        <span
          class="text-xs font-semibold px-2.5 py-1 rounded-full border transition-colors"
          style="border-color: var(--accent); color: var(--accent)"
        >
          {{ tag.label }}
        </span>
      } @else {
        <span
          class="text-xs font-semibold px-2.5 py-1 rounded-full border border-white/20 text-white/40"
        >
          {{ tag.label }}
        </span>
      }
    }
  </div>
</article>
